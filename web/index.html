<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Incident Commander</title>
<meta name="description" content="A retro arcade game about being on call: steer the Incident Commander, resolve every alert, and don't run into your own trail. Built with Go and WebAssembly.">
<meta name="theme-color" content="#0e0a16">
<link rel="canonical" href="https://incident-commander-game.vercel.app/">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Incident Commander">
<meta property="og:title" content="Incident Commander">
<meta property="og:description" content="A retro arcade game about being on call. Resolve every alert; don't run into your own trail.">
<meta property="og:url" content="https://incident-commander-game.vercel.app/">
<meta property="og:image" content="https://incident-commander-game.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Incident Commander: a pixel robot with a headset and a red beacon, on an arcade board of alerts and resolved checks">

<meta name="twitter:description" content="A retro arcade game about being on call. Resolve every alert; don't run into your own trail.">

<link rel="preload" href="/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/game.wasm" as="fetch" type="application/wasm" crossorigin>
<style>
@font-face{font-family:"Press Start 2P";src:url(/fonts/press-start-2p.woff2) format("woff2");font-display:swap}
:root{--bg:#0e0a16;--cab:#1b1428;--key:#2a2040;--pink:#ff4fd8;--cyan:#4ff0ff;--yel:#ffe45c;--green:#3ddc84;--red:#ff4d4d;--mute:#9b8fb3}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse 70% 50% at 50% 0,#2a1840,var(--bg) 70%) var(--bg);color:#fff;
  font-family:"Press Start 2P",ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;padding:28px 16px calc(20px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.cab{width:min(500px,100%);background:var(--cab);border:3px solid #000;border-radius:14px;overflow:hidden;box-shadow:0 20px 50px #0008}
.marq{margin:0;padding:16px 10px 14px;text-align:center;background:linear-gradient(#2b1a44,var(--cab));border-bottom:3px solid #000;
  font-size:clamp(14px,3.6vw,20px);font-weight:400;color:var(--yel);text-shadow:2px 2px 0 #b5179e}
.hud{display:flex;justify-content:space-between;font-size:8px;color:var(--mute);padding:12px 16px 8px}
.hud b{display:block;color:#fff;font-weight:400;margin-top:5px;font-size:10px}
.crt{position:relative;margin:0 14px 14px;border-radius:10px;background:#000;padding:6px;touch-action:none}
.crt canvas{display:block;width:100%;aspect-ratio:1;border-radius:6px;background:#0b0714;image-rendering:pixelated}
.crt::after{content:"";position:absolute;inset:6px;border-radius:6px;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px)}
.ov{position:absolute;inset:6px;display:grid;place-items:center;text-align:center;padding:12px;z-index:1}
.ov[hidden]{display:none}
.ov div{background:#0e0a16e6;border:2px solid var(--pink);padding:16px 18px;max-width:92%}
.ov b{display:block;color:var(--yel);font-weight:400;font-size:12px;line-height:1.6}
.ov b.blink{animation:bl 1s steps(2) infinite}
.ov p{margin:12px 0 0;font-size:8px;color:var(--mute);line-height:1.9}
.ov p.hi{color:var(--green)}
.ov.clear div{border-color:var(--green)}.ov.clear b{color:var(--green)}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov b.blink{animation:none}}
.pad{display:none}
.pad button{font:inherit;color:#fff;background:var(--key);border:2px solid #000;border-radius:10px;box-shadow:0 3px 0 #000;font-size:14px;touch-action:manipulation;cursor:pointer}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad .p{grid-column:1;grid-row:1;font-size:7px;color:var(--cyan)}.pad .m{grid-column:3;grid-row:1;font-size:7px;color:var(--yel)}
.foot{font-size:7px;color:var(--mute);text-align:center;margin-top:16px;line-height:2.2}
.foot a{color:var(--cyan);text-decoration:none}.foot a:hover{text-decoration:underline}
.foot button{font:inherit;color:var(--yel);background:none;border:0;padding:0;cursor:pointer}
.keys{display:block}
@media (max-width:600px),(pointer:coarse){
  body{padding:16px 12px calc(16px + env(safe-area-inset-bottom))}
  .pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center;padding:2px 0 16px}
  .keys{display:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<main class="cab">
  <h1 class="marq">INCIDENT COMMANDER</h1>
  <div class="hud" aria-live="off">
    <span>SCORE<b id="score">000000</b></span>
    <span>HI<b id="hi">000000</b></span>
    <span>LEVEL<b id="level">01</b></span>
    <span>ALERTS<b id="alerts">0/5</b></span>
  </div>
  <div class="crt" id="crt">
    <canvas id="game-canvas" width="600" height="600" aria-label="Game board"></canvas>
    <div class="ov" id="ov"><div><b class="blink">LOADING…</b></div></div>
  </div>
  <div class="pad" id="pad">
    <button class="p" data-cmd="toggle" id="pad-p" aria-label="Start or pause">START</button>
    <button class="u" data-cmd="up" aria-label="Up">▲</button>
    <button class="m" data-cmd="mute" id="pad-m" aria-label="Sound on or off">SOUND</button>
    <button class="l" data-cmd="left" aria-label="Left">◀</button>
    <button class="d" data-cmd="down" aria-label="Down">▼</button>
    <button class="r" data-cmd="right" aria-label="Right">▶</button>
  </div>
</main>
<p class="foot">
  <span class="keys">ARROWS / WASD MOVE · SPACE PAUSE · M SOUND: <button id="mute-link" type="button">ON</button><br></span>
  A GAME BY <a href="https://www.nathannam.com">NATHAN NAM</a> · <a href="https://github.com/NathanNam/incident-commander-game">CODE</a>
</p>
<p class="sr" id="sr" aria-live="polite"></p>

<script src="/wasm_exec.js"></script>
<script src="/sound.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('game-canvas'), ov = $('ov');
  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let hi = +store.get('ic.hi', 0) || 0;
  let state = 'loading', last = {};
  const pad = (n, w) => String(n).padStart(w, '0');

  // ---- canvas: device pixels, a multiple of the 20-cell grid --------------------------
  function sizeCanvas() {
    const css = canvas.getBoundingClientRect().width;
    const px = Math.max(200, Math.floor(css * (window.devicePixelRatio || 1) / 20) * 20);
    if (canvas.width !== px) { canvas.width = canvas.height = px; window.ic.redraw?.(); }
  }
  new ResizeObserver(sizeCanvas).observe(canvas);

  // ---- sound (web/sound.js): M or SOUND cycles all → effects only → off -------------
  const SOUND_MODES = ['all', 'fx', 'off'];
  const SOUND_LABEL = { all: ['ON', 'SOUND'], fx: ['FX ONLY', 'FX ONLY'], off: ['OFF', 'MUTED'] };
  function setSound(m) {
    if (!SOUND_MODES.includes(m)) m = 'all';
    icSound.setMode(m); store.set('ic.sound', m);
    $('mute-link').textContent = SOUND_LABEL[m][0];
    $('pad-m').textContent = SOUND_LABEL[m][1];
  }
  setSound(store.get('ic.sound', 'all'));

  // ---- overlays ------------------------------------------------------------------------
  function show(html, cls = '') { ov.className = 'ov ' + cls; ov.innerHTML = `<div>${html}</div>`; ov.hidden = false; }
  const touch = matchMedia('(max-width:600px),(pointer:coarse)').matches;
  const howTo = touch ? 'SWIPE OR USE THE ARROWS' : 'ARROW KEYS OR WASD';
  let newHi = false;

  function render(s) {
    $('score').textContent = pad(s.score, 6);
    $('hi').textContent = pad(Math.max(hi, s.score), 6);
    $('level').textContent = pad(s.level, 2);
    $('alerts').textContent = `${s.alerts}/${s.needed}`;
    $('pad-p').textContent = s.state === 'playing' ? 'PAUSE' : 'START';
    if (s.state === state && s.level === last.level) { last = s; return; }
    const was = state;
    state = s.state; last = s;
    // Music plays only while the commander is moving; it restarts from the top on a new game.
    if (state === 'playing' && (was === 'ready' || was === 'gameover' || was === 'won')) icSound.restartMusic();
    icSound.music(state === 'playing', s.level);
    if (state === 'playing' && was === 'paused') icSound.sfx('resume');
    else if (state === 'playing' && was !== 'levelclear' && was !== 'loading') icSound.sfx('start');
    else if (state === 'paused') icSound.sfx('pause');
    switch (state) {
      case 'ready': newHi = false; show(`<b class="blink">PRESS START</b><p>${howTo}<br>RESOLVE EVERY ALERT.<br>DON'T HIT YOUR TRAIL.</p>`); break;
      case 'paused': show(`<b>PAUSED</b><p>${touch ? 'TAP START' : 'SPACE'} TO RESUME</p>`); break;
      case 'levelclear': show(`<b>LEVEL ${pad(s.level, 2)} CLEAR</b><p>ALL ALERTS RESOLVED</p>`, 'clear'); break;
      case 'gameover': show(`<b>GAME OVER</b><p>SCORE ${pad(s.score, 6)}</p>${newHi ? '<p class="hi">NEW HI-SCORE!</p>' : ''}<p>${touch ? 'TAP START' : 'SPACE'} TO PLAY AGAIN</p>`); break;
      case 'won': show(`<b>ALL CLEAR!</b><p>10 LEVELS · SCORE ${pad(s.score, 6)}</p>${newHi ? '<p class="hi">NEW HI-SCORE!</p>' : ''}<p>THE PAGER IS QUIET. FOR NOW.</p>`, 'clear'); break;
      default: ov.hidden = true;
    }
    $('sr').textContent = state === 'playing' ? '' : ov.textContent;
  }

  window.ic = {
    onReady() { sizeCanvas(); },
    onFrame: render,
    onEvent(name) {
      if ((name === 'gameover' || name === 'won') && last.score > hi) {
        hi = last.score; newHi = true; store.set('ic.hi', hi);
      }
      icSound.sfx(name);
    },
  };

  // ---- controls ------------------------------------------------------------------------
  function command(cmd) {
    if (!window.ic.control) return;
    if (cmd === 'mute') return setSound(SOUND_MODES[(SOUND_MODES.indexOf(icSound.mode) + 1) % 3]);
    if (cmd === 'toggle') cmd = state === 'playing' || state === 'paused' ? 'pause' : 'start';
    if (['up', 'down', 'left', 'right'].includes(cmd) && (state === 'gameover' || state === 'won')) return;
    if (['up', 'down', 'left', 'right'].includes(cmd) && state === 'paused') window.ic.control('pause');
    window.ic.control(cmd);
  }
  const KEYS = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right', ' ': 'toggle', Enter: 'toggle', p: 'toggle', P: 'toggle', r: 'restart', R: 'restart', m: 'mute', M: 'mute' };
  addEventListener('keydown', (e) => {
    const cmd = KEYS[e.key];
    if (!cmd || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault(); command(cmd);
  });
  $('pad').addEventListener('pointerdown', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    e.preventDefault(); command(b.dataset.cmd);
  });
  $('mute-link').addEventListener('click', () => command('mute'));

  // Swipe on the screen to steer; tap to start or pause.
  let t0 = null;
  const crt = $('crt');
  crt.addEventListener('pointerdown', (e) => { t0 = { x: e.clientX, y: e.clientY }; });
  crt.addEventListener('pointerup', (e) => {
    if (!t0) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y; t0 = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return command('toggle');
    command(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });

  // Pause when the tab is hidden, so the music doesn't play in the background.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') window.ic.control?.('pause');
  });

  // ---- boot ----------------------------------------------------------------------------
  const go = new Go();
  WebAssembly.instantiateStreaming(fetch('/game.wasm'), go.importObject)
    .then(({ instance }) => go.run(instance))
    .catch((err) => { console.error(err); show('<b>COULDN\'T LOAD</b><p>REFRESH TO TRY AGAIN</p>'); });
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
